<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dharmadhikari Constructions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Space Grotesk', sans-serif;
        }
        .neubrutalism {
            border: 3px solid black;
            box-shadow: 5px 5px 0px black;
            transition: all 0.2s ease;
        }
        .neubrutalism:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px black;
        }
        .calendar-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-yellow-50">
    <nav class="bg-orange-400 p-4 neubrutalism mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-2xl font-bold">Dharmadhikari Constructions</div>
            <div class="space-x-4">
                <button onclick="showSection('bookingForm')" class="neubrutalism bg-white px-4 py-2">Booking</button>
                <button onclick="showSection('calendar')" class="neubrutalism bg-white px-4 py-2">Calendar</button>
                <button onclick="showSection('bookingList')" class="neubrutalism bg-white px-4 py-2">View Bookings</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <!-- Booking Form -->
        <div id="bookingForm" class="section">
            <div class="max-w-md mx-auto neubrutalism bg-white p-6">
                <h2 class="text-2xl font-bold mb-4">Book an Event</h2>
                <form id="eventForm" class="space-y-4">
                    <div>
                        <label class="block mb-2">Name</label>
                        <input type="text" id="name" required class="w-full p-2 neubrutalism">
                    </div>
                    <div>
                        <label class="block mb-2">Mobile Number</label>
                        <input type="tel" id="mobile" required class="w-full p-2 neubrutalism">
                    </div>
                    <div>
                        <label class="block mb-2">Event Date</label>
                        <input type="date" id="date" required class="w-full p-2 neubrutalism">
                    </div>
                    <button type="submit" class="w-full bg-orange-400 neubrutalism p-2">Save Booking</button>
                </form>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="calendar" class="section hidden">
            <div class="max-w-2xl mx-auto neubrutalism bg-white p-6">
                <h2 class="text-2xl font-bold mb-4">Auspicious Dates Calendar</h2>
                <div id="calendarContainer"></div>
            </div>
        </div>

        <!-- Booking List -->
        <div id="bookingList" class="section hidden">
            <div class="max-w-2xl mx-auto neubrutalism bg-white p-6">
                <h2 class="text-2xl font-bold mb-4">All Bookings</h2>
                <div id="bookingsContainer" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        // Store bookings in localStorage
        let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

        // Form submission
        document.getElementById('eventForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const booking = {
                name: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                date: document.getElementById('date').value,
                id: Date.now()
            };
            bookings.push(booking);
            localStorage.setItem('bookings', JSON.stringify(bookings));
            alert('Booking saved successfully!');
            this.reset();
            displayBookings();
        });

        // Display bookings
        function displayBookings() {
            const container = document.getElementById('bookingsContainer');
            container.innerHTML = '';
            bookings.forEach(booking => {
                const bookingDiv = document.createElement('div');
                bookingDiv.className = 'neubrutalism p-4 bg-orange-100';
                bookingDiv.innerHTML = `
                    <p><strong>Name:</strong> ${booking.name}</p>
                    <p><strong>Mobile:</strong> ${booking.mobile}</p>
                    <p><strong>Date:</strong> ${booking.date}</p>
                `;
                container.appendChild(bookingDiv);
            });
        }

        // Section navigation
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
            if(sectionId === 'bookingList') {
                displayBookings();
            }
            if(sectionId === 'calendar') {
                displayCalendar();
            }
        }

        // Calendar functionality
        function displayCalendar() {
            const calendarContainer = document.getElementById('calendarContainer');
            const date = new Date();
            const year = date.getFullYear();
            const month = date.getMonth();

            const calendar = document.createElement('div');
            calendar.className = 'grid grid-cols-7 gap-2';

            // Add days of week
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'text-center font-bold';
                dayDiv.textContent = day;
                calendar.appendChild(dayDiv);
            });

            // Add calendar dates
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            for(let i = 0; i < firstDay.getDay(); i++) {
                calendar.appendChild(document.createElement('div'));
            }

            for(let day = 1; day <= lastDay.getDate(); day++) {
                const dateDiv = document.createElement('div');
                dateDiv.className = 'neubrutalism p-2 text-center bg-white cursor-pointer';
                dateDiv.textContent = day;
                calendar.appendChild(dateDiv);
            }

            calendarContainer.innerHTML = '';
            calendarContainer.appendChild(calendar);
        }

        // Initial display
        showSection('bookingForm');
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
